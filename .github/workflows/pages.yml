name: GitHub Pages (read-only mirror)

on:
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # VITE_API_BASE: set a repository variable named LATE_ICE_API to the address
      # of a running Late Ice server and the Pages site becomes the full app.
      # Leave it empty and the site is a read-only snapshot generated here.
      - run: npm run build:pages
        env:
          VITE_API_BASE: ${{ vars.LATE_ICE_API }}
      - run: cp dist/public/index.html dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
