name: Live check

# Hits the deployed app's public API and pages, then loads it in a real browser and
# reports console errors, failed requests and a screenshot (pushed to ci-shots).
on:
  workflow_dispatch:
  push:
    branches: [nextjs-supabase]
    paths: [".github/workflows/live-check.yml"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE: https://late-ice.tangomike.app
    steps:
      - name: Wait for the deploy of this commit
        run: sleep 120
      - name: Check endpoints
        run: |
          for p in /api/bootstrap /api/feed /api/rink / /sw.js /manifest.webmanifest; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$BASE$p")
            echo "== $p -> $code"; head -c 200 /tmp/body | tr '\n' ' '; echo
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the site in a browser
        run: |
          mkdir -p /tmp/b && cd /tmp/b && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > b.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [w, h, name] of [[390, 844, "phone"], [1440, 1000, "desktop"]]) {
            const p = await (await b.newContext({ viewport: { width: w, height: h } })).newPage();
            p.on("console", (m) => { if (m.type() === "error" || m.type() === "warning") console.log(`[${name}] console.${m.type()}: ${m.text()}`); });
            p.on("pageerror", (e) => console.log(`[${name}] pageerror: ${e.message}\n${(e.stack || "").split("\n").slice(0, 6).join("\n")}`));
            p.on("requestfailed", (r) => console.log(`[${name}] requestfailed: ${r.url()} ${r.failure()?.errorText}`));
            p.on("response", (r) => { if (r.url().includes("/api/") || r.status() >= 400) console.log(`[${name}] ${r.status()} ${r.url()}`); });
            await p.goto(process.env.BASE, { waitUntil: "networkidle" }).catch((e) => console.log(`[${name}] goto: ${e.message}`));
            await p.waitForTimeout(4000);
            console.log(`[${name}] header label: ${await p.locator(".label").first().innerText().catch(() => "?")}`);
            await p.screenshot({ path: `/tmp/live-${name}.png`, fullPage: true });
          }
          await b.close();
          JS
          node b.mjs
      - name: Publish screenshots to ci-shots
        if: always()
        run: |
          git config --global user.name ci && git config --global user.email ci@users.noreply.github.com
          git clone -q --depth 1 --branch ci-shots "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" s || exit 0
          cd s && cp /tmp/live-*.png . 2>/dev/null && git add live-*.png && git commit -qm "live shots" && git push -q || true
