# Local Supabase stack for development and CI (`npx supabase start`).
# The hosted project is configured in the Supabase dashboard; see README.
project_id = "late-ice"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Late Ice code: {{ .Code }}"
max_frequency = "5s"

# Fixed codes for test numbers. No text is sent for these.
[auth.sms.test_otp]
19105550101 = "123456"
19105550102 = "123456"
19105550103 = "123456"
19105550199 = "123456"

# A provider must be enabled for phone sign-in. Locally only test numbers are used.
[auth.sms.twilio]
enabled = true
account_sid = "AC00000000000000000000000000000000"
message_service_sid = "MG00000000000000000000000000000000"
auth_token = "local-only-not-a-secret"
